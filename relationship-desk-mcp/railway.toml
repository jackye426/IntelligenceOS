# Railway reads this when service Root Directory = relationship-desk-mcp
[build]
builder = "RAILPACK"

[deploy]
startCommand = "sh -c 'exec uvicorn main:app --host 0.0.0.0 --port \"${PORT:-8000}\" --proxy-headers --forwarded-allow-ips=\"*\"'"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"

